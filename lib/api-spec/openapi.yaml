openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Regionalshuttle Buchungssystem - Stiftung Louisenlund
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Shuttle bookings
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Submit a new shuttle booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingConfirmation"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/import:
    post:
      operationId: importBookings
      tags: [admin]
      summary: Import bookings from Excel file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BookingImportRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid file
        "401":
          description: Unauthorized

  /admin/bookings/calculate-routes:
    post:
      operationId: calculateRoutes
      tags: [admin]
      summary: Calculate driving distance and duration for all bookings missing route data
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                type: object
                required: [processed, failed, skipped]
                properties:
                  processed:
                    type: integer
                  failed:
                    type: integer
                  skipped:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        "401":
          description: Unauthorized

  /admin/bookings:
    get:
      operationId: listAdminBookings
      tags: [admin]
      summary: List all bookings (admin)
      parameters:
        - name: tariffZone
          in: query
          schema:
            type: ["string", "null"]
        - name: bookingType
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: gradeYear
          in: query
          schema:
            type: ["string", "null"]
        - name: outboundRoute
          in: query
          schema:
            type: ["string", "null"]
        - name: returnRoute
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
            default: 1
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
            default: 50
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookingList"
        "401":
          description: Unauthorized

  /admin/bookings/{id}:
    get:
      operationId: getAdminBooking
      tags: [admin]
      summary: Get booking detail (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookingDetail"
        "404":
          description: Not found

    delete:
      operationId: deleteAdminBooking
      tags: [admin]
      summary: Delete a booking (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteBookingResponse"
        "404":
          description: Not found
        "401":
          description: Unauthorized

    patch:
      operationId: updateAdminBooking
      tags: [admin]
      summary: Update booking status or notes (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookingDetail"
        "404":
          description: Not found

  /admin/bookings/export:
    get:
      operationId: exportBookings
      tags: [admin]
      summary: Export bookings as CSV
      parameters:
        - name: tariffZone
          in: query
          schema:
            type: ["string", "null"]
        - name: bookingType
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get booking statistics overview
      responses:
        "200":
          description: Stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Get current admin session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not authenticated

  /admin/notification-emails:
    get:
      operationId: listNotificationEmails
      tags: [admin]
      summary: List notification email recipients
      responses:
        "200":
          description: List of notification emails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEmailList"
        "401":
          description: Unauthorized
    post:
      operationId: addNotificationEmail
      tags: [admin]
      summary: Add a notification email recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationEmailInput"
      responses:
        "201":
          description: Email added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEmail"
        "400":
          description: Invalid input
        "409":
          description: Email already exists
        "401":
          description: Unauthorized

  /admin/notification-emails/{id}:
    delete:
      operationId: deleteNotificationEmail
      tags: [admin]
      summary: Remove a notification email recipient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized

  /admin/smtp-config:
    get:
      operationId: getSmtpConfig
      tags: [admin]
      summary: Get SMTP configuration (password masked)
      responses:
        "200":
          description: SMTP config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpConfig"
        "401":
          description: Unauthorized
    put:
      operationId: updateSmtpConfig
      tags: [admin]
      summary: Update SMTP configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmtpConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpConfig"
        "401":
          description: Unauthorized

  /admin/smtp-config/test:
    post:
      operationId: testSmtpConfig
      tags: [admin]
      summary: Send a test email using current SMTP config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmtpTestRequest"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpTestResult"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    TariffZone:
      type: string
      enum: [zone1, zone2, zone3]

    RouteOption:
      type: string
      enum: [zone1, zone2, zone3, none]

    BookingType:
      type: string
      enum: [full_year, first_half]

    BookingStatus:
      type: string
      enum: [received, reviewed, confirmed, query_open, waitlisted]

    SiblingInput:
      type: object
      required:
        - childName
        - gradeYear
        - outboundRoute
        - returnRoute
      properties:
        childName:
          type: string
        studentNumber:
          type: ["string", "null"]
        gradeYear:
          type: string
        outboundRoute:
          $ref: "#/components/schemas/RouteOption"
        returnRoute:
          $ref: "#/components/schemas/RouteOption"

    BookingInput:
      type: object
      required:
        - childName
        - childAddress
        - childPostalCode
        - childCity
        - gradeYear
        - parentName
        - parentEmail
        - parentPhone
        - tariffZone
        - bookingType
        - outboundRoute
        - returnRoute
        - siblings
        - confirmationAccepted
        - signatureName
      properties:
        childName:
          type: string
          minLength: 2
        childAddress:
          type: string
          minLength: 2
        childPostalCode:
          type: string
          minLength: 4
        childCity:
          type: string
          minLength: 2
        studentNumber:
          type: ["string", "null"]
        gradeYear:
          type: string
        parentName:
          type: string
          minLength: 2
        parentEmail:
          type: string
          format: email
        parentPhone:
          type: string
          minLength: 6
        tariffZone:
          $ref: "#/components/schemas/TariffZone"
        bookingType:
          $ref: "#/components/schemas/BookingType"
        outboundRoute:
          $ref: "#/components/schemas/RouteOption"
        returnRoute:
          $ref: "#/components/schemas/RouteOption"
        siblings:
          type: array
          items:
            $ref: "#/components/schemas/SiblingInput"
          maxItems: 3
        confirmationAccepted:
          type: boolean
        signatureName:
          type: string
          minLength: 2
        gdprConsent:
          type: boolean

    BookingConfirmation:
      type: object
      required:
        - id
        - referenceNumber
        - message
      properties:
        id:
          type: integer
        referenceNumber:
          type: string
        message:
          type: string

    Sibling:
      type: object
      required:
        - id
        - childName
        - gradeYear
        - outboundRoute
        - returnRoute
        - status
      properties:
        id:
          type: integer
        childName:
          type: string
        studentNumber:
          type: ["string", "null"]
        gradeYear:
          type: string
        outboundRoute:
          type: string
        returnRoute:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        priceCents:
          type: ["integer", "null"]

    AdminBooking:
      type: object
      required:
        - id
        - referenceNumber
        - childName
        - childAddress
        - childPostalCode
        - childCity
        - gradeYear
        - parentName
        - parentEmail
        - tariffZone
        - bookingType
        - outboundRoute
        - returnRoute
        - status
        - createdAt
        - siblingCount
      properties:
        id:
          type: integer
        referenceNumber:
          type: string
        childName:
          type: string
        childAddress:
          type: string
        childPostalCode:
          type: string
        childCity:
          type: string
        gradeYear:
          type: string
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        tariffZone:
          type: string
        bookingType:
          type: string
        outboundRoute:
          type: string
        returnRoute:
          type: string
        status:
          type: string
        createdAt:
          type: string
        siblingCount:
          type: integer
        priceCents:
          type: ["integer", "null"]
        distanceKm:
          type: ["number", "null"]
          description: Driving distance from home to school in km
        durationMinutes:
          type: ["integer", "null"]
          description: Estimated driving duration in minutes
        siblings:
          type: array
          items:
            $ref: "#/components/schemas/Sibling"

    AdminBookingDetail:
      type: object
      required:
        - id
        - referenceNumber
        - childName
        - childAddress
        - childPostalCode
        - childCity
        - gradeYear
        - parentName
        - parentEmail
        - parentPhone
        - tariffZone
        - bookingType
        - outboundRoute
        - returnRoute
        - status
        - createdAt
        - siblings
      properties:
        id:
          type: integer
        referenceNumber:
          type: string
        childName:
          type: string
        childAddress:
          type: string
        childPostalCode:
          type: string
        childCity:
          type: string
        studentNumber:
          type: ["string", "null"]
        gradeYear:
          type: string
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        tariffZone:
          type: string
        bookingType:
          type: string
        outboundRoute:
          type: string
        returnRoute:
          type: string
        signatureName:
          type: string
        status:
          type: string
        adminNotes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        priceCents:
          type: ["integer", "null"]
        distanceKm:
          type: ["number", "null"]
          description: Driving distance from home to school in km
        durationMinutes:
          type: ["integer", "null"]
          description: Estimated driving duration in minutes
        pickupAddress:
          type: ["string", "null"]
          description: Alternative pickup location (if different from home address)
        pickupPostalCode:
          type: ["string", "null"]
        pickupCity:
          type: ["string", "null"]
        siblings:
          type: array
          items:
            $ref: "#/components/schemas/Sibling"

    AdminBookingList:
      type: object
      required:
        - bookings
        - total
        - page
        - limit
        - totalPriceCents
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/AdminBooking"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPriceCents:
          type: integer
          description: Sum of price_cents for all matching bookings (all pages)

    BookingStatusUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BookingStatus"
        adminNotes:
          type: ["string", "null"]
        childName:
          type: string
        studentNumber:
          type: ["string", "null"]
        gradeYear:
          type: string
        childAddress:
          type: string
        childPostalCode:
          type: string
        childCity:
          type: string
        parentName:
          type: string
        parentEmail:
          type: string
          format: email
        parentPhone:
          type: ["string", "null"]
        tariffZone:
          type: string
          enum: [zone1, zone2, zone3]
        bookingType:
          type: string
          enum: [full_year, first_half]
        outboundRoute:
          type: string
          enum: [zone1, zone2, zone3, none]
        returnRoute:
          type: string
          enum: [zone1, zone2, zone3, none]
        pickupAddress:
          type: ["string", "null"]
        pickupPostalCode:
          type: ["string", "null"]
        pickupCity:
          type: ["string", "null"]
        siblingUpdates:
          type: array
          description: Per-sibling route overrides (by sibling id)
          items:
            type: object
            required:
              - id
              - outboundRoute
              - returnRoute
            properties:
              id:
                type: integer
              outboundRoute:
                $ref: "#/components/schemas/RouteOption"
              returnRoute:
                $ref: "#/components/schemas/RouteOption"
              studentNumber:
                type: ["string", "null"]
              status:
                $ref: "#/components/schemas/BookingStatus"

    AdminStats:
      type: object
      required:
        - totalBookings
        - byStatus
        - byTariffZone
        - byBookingType
        - byGradeYear
        - totalChildren
        - recentBookings
      properties:
        totalBookings:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        byTariffZone:
          type: object
          additionalProperties:
            type: integer
        byBookingType:
          type: object
          additionalProperties:
            type: integer
        byGradeYear:
          type: object
          additionalProperties:
            type: integer
        totalChildren:
          type: integer
        recentBookings:
          type: array
          items:
            $ref: "#/components/schemas/AdminBooking"

    NotificationEmail:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: integer
        email:
          type: string
        label:
          type: ["string", "null"]
        createdAt:
          type: string

    NotificationEmailList:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEmail"

    NotificationEmailInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        label:
          type: ["string", "null"]

    BookingImportRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    ImportResult:
      type: object
      required: [imported, skipped, errors, total]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        total:
          type: integer
        errors:
          type: array
          items:
            type: string

    DeleteBookingResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    AdminCredentials:
      type: object
      required:
        - password
      properties:
        password:
          type: string

    AdminSession:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        username:
          type: ["string", "null"]

    SmtpConfig:
      type: object
      required:
        - host
        - port
        - user
        - fromAddress
        - secure
        - configured
      properties:
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        fromAddress:
          type: string
        secure:
          type: boolean
        configured:
          type: boolean
          description: True if host and user are set

    SmtpConfigUpdate:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        pass:
          type: string
          description: Leave empty to keep existing password
        fromAddress:
          type: string
        secure:
          type: boolean

    SmtpTestRequest:
      type: object
      required:
        - to
      properties:
        to:
          type: string
          format: email

    SmtpTestResult:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        error:
          type: ["string", "null"]
