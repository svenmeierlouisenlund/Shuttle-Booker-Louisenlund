        - secure
        - configured
      properties:
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        fromAddress:
          type: string
        secure:
          type: boolean
        configured:
          type: boolean
          description: True if host and user are set

    SmtpConfigUpdate:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        pass:
          type: string
          description: Leave empty to keep existing password
        fromAddress:
          type: string
        secure:
          type: boolean

    SmtpTestRequest:
      type: object
      required:
        - to
