kind = "web"
previewPath = "/"
title = "Regionalshuttle Louisenlund"
version = "1.0.0"
id = "artifacts/louisenlund"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22499

[services.development]
run = "pnpm --filter @workspace/louisenlund run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/louisenlund", "run", "build" ]
publicDir = "artifacts/louisenlund/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22499"
BASE_PATH = "/"
